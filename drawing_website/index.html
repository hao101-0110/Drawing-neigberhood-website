
<!DOCTYPE html>
<html>
<head>
  <title>Draw Your Building</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <h1>Draw Your Building</h1>
  <div class="toolbar">
    <button class="color" data-color="black" style="background:black;"></button>
    <button class="color" data-color="red" style="background:red;"></button>
    <button class="color" data-color="blue" style="background:blue;"></button>
    <button class="color" data-color="green" style="background:green;"></button>
    <button class="color" data-color="yellow" style="background:yellow;"></button>
    <button id="eraser">Eraser</button>
    <button id="save">Save</button>
    <button id="toNeighborhood">To Neighborhood</button>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <script src="scripts/drawing.js"></script>
</body>
</html>
